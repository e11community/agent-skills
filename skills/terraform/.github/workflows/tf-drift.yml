name: Drift Detection
on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  TF_VERSION: "1.9.8"

jobs:
  drift-envstack-main:
    name: Drift — ${{ matrix.env }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    env:
      project_id: PLATFORM-${{ matrix.env }}-100
    concurrency:
      cancel-in-progress: false
      queue: max
      group: drift-${{ matrix.env }}
    strategy:
      matrix:
        env:
          - ci
          - qa
          - demo
          - prod
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v6

      - id: terraform_setup
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - id: auth
        name: GCP Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.project_id }}

      - id: terraform_init
        name: Terraform Init
        working-directory: hcl/environments/${{ matrix.env }}/main
        run: terraform init

      - id: drift
        name: Detect Drift
        env:
          TF_VAR_cloudflare_api_token: ${{ fromJson(secrets.CLOUDFLARE_ZONE_USER_API_TOKEN).token }}
          # TF_VAR_mailgun_api_key: $--{{ secrets.MAILGUN_API_KEY }}
          # TF_VAR_rollbar_api_key: $--{{ secrets.ROLLBAR_API_KEY }}
        working-directory: hcl/environments/${{ matrix.env }}/main
        timeout-minutes: 20
        run: |
          set +e
          terraform plan \
            -detailed-exitcode \
            -no-color 2>&1 | tee drift.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Open Issue on Drift
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Drift detected: ${{ matrix.env }}`,
              body: `Drift in **${{ matrix.env }}** on ${new Date().toISOString().split('T')[0]}.\n\n\`\`\`\ncd hcl/environments/${{ matrix.env }}/main\nterraform plan\n\`\`\``,
              labels: ['drift', 'terraform']
            });
